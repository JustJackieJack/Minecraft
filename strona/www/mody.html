<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="/style.css">

</head>
<body>
  <header class="pasek">
    <a class="logo" href="/">Ci Panowie</a>
    <nav aria-label="Główne">

      <a href="/zainstaluj">Zainstaluj</a>

    <section class="panel">
      <h1>Mody</h1>
      <label class="etykieta" for="szukaj">Szukaj po nazwie</label>

      <div id="filtry" class="filtry" role="group" aria-label="Filtruj po tagu"></div>
      <p id="licznik" class="licznik" role="status">Wczytuję listę…</p>

    <ul id="lista" class="mody"></ul>
